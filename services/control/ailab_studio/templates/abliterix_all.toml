[kl]
scale = 0.1
token_count = 16
objective_mode = "independent"
target = 0.1
prune_threshold = 0.099999

[detection]
llm_judge = true
llm_judge_model = "deepseek-v4-flash:0731"
llm_judge_base_url = "https://ollama.com/v1"
llm_judge_api_key_env = "LLM_JUDGE_API_KEY"
llm_judge_auth_header = "Authorization"
llm_judge_auth_prefix = "Bearer "
llm_judge_temperature = 0.0
llm_judge_use_response_format = true
llm_judge_max_tokens_field = "max_tokens"
llm_judge_reasoning_budget = 2048
llm_judge_batch_size = 5
llm_judge_concurrency = 3

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "/shared/Checkpoints/Qwen3.8-27B/datasets/good_1000"
split = "train[:800]"
column = "prompt"

[target_prompts]
dataset = "/shared/Checkpoints/Qwen3.8-27B/datasets/harmful_1000"
split = "train[:800]"
column = "prompt"

[benign_eval_prompts]
