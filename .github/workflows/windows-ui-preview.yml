name: Windows UI Preview

on:
  push:
    branches: [windows-ui-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AILAB_WINDOWS_OUTPUT_DIR: ${{ github.workspace }}/release/GCSA-AiLab-Windows-UI
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test preview and existing navigation
        run: npm test -- tests/frontend/windows-ui-preview.test.ts tests/frontend/category-resume.test.tsx
      - run: npm run build:windows-ui
      - name: Run packaged UI smoke test
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'ailab-ui-smoke.json'
          $app = Join-Path $env:AILAB_WINDOWS_OUTPUT_DIR 'AiLab-UI.exe'
          $process = Start-Process -FilePath $app -ArgumentList "--smoke-result=$result" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "UI smoke test failed with exit code $($process.ExitCode)" }
          $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.failures.Count) { throw 'UI verification did not pass.' }
          Copy-Item -LiteralPath $result -Destination (Join-Path $env:AILAB_WINDOWS_OUTPUT_DIR 'ui-verification.json')
      - uses: actions/upload-artifact@v7
        with:
          name: GCSA-AiLab-Windows-UI-x64
          path: release/GCSA-AiLab-Windows-UI/
          if-no-files-found: error
          retention-days: 14
