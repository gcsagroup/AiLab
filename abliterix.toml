seed = 260915

[model]
dtype_fallback_order = ["bfloat16"]
backend = "vllm"

[inference]
batch_size = 64
max_batch_size = 128

[steering]
vector_method = "mean"
steering_mode = "direct"
decay_kernel = "linear"
orthogonal_projection = true
projected_abliteration = true
winsorize_vectors = true
weight_normalization = "none"
strength_range = [0.3, 5.0]
fixed_vector_scope = "per layer"

[optimization]
num_trials = 30
num_warmup_trials = 10

checkpoint_dir = "/shared/Checkpoints/XHToken--Spark-X2.5-4B/v23-refusal-first"


[kl]
target = 0.1


[detection]
llm_judge = true
llm_judge_model = "deepseek-v4-flash:0731"
llm_judge_base_url = "https://ollama.com/v1"
llm_judge_api_key_env = "LLM_JUDGE_API_KEY"


