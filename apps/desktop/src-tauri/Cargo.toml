[package]
name = "gcsa-ailab"
version = "3.0.0"
description = "GCSA AI Lab 本地 AI 工作台"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gcsa_ailab_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
rfd = "0.15"
base64 = "0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"

# macOS 27 会拒绝部分经调试信息剥离的宏动态库；保留符号，避免 LINKEDIT 错位。
# https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"
